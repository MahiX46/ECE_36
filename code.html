<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header {
            background: linear-gradient(to right, #293185cf, #297695);
            color: white;
            text-align: center;
            width: 100%;
            height: 180px;
        }
        .nav {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(to right, hsl(184, 100%, 15%), #013c20);
            height: 50px;
            width: 100%;
        }
        .main{
            display: grid;
            grid-template-columns:75% 25%;
            justify-content: space-around;

        }
        .left{
            background: linear-gradient(to right, #350101, #67060b);
            justify-content: space-around;
            height: 100%;
            width: 100%;
                }
        .sidebar{
            background: linear-gradient(to right, hwb(64 4% 72%), #8f7c1f);
                        justify-content: space-around;
            height: 100%;
            width: 100%;
            
        }
        .content{
            background: linear-gradient(to right, #16164d, #313184);
            justify-content: space-around;
            height: 114%;
            width: 100%;


        }
        .small-box{
            background: linear-gradient(to right, #082f3a, #102d2e);
            justify-content: space-around;
            margin: 10px 0;
            text-align: center;
            height: 200px;
            width: 100%;
        }      
         .footer {
            background: linear-gradient(to right, #293185cf, #297695);
            color: white;

            text-align: center;

            height: 100px;
            width: 500%;

            display: flex;
            justify-content:space-around;
            align-items: center;
        } 

    </style>
</head>
<body>
    <div class="header">
        <h1>Header element</h1>
    </div>
    <div class="nav">
        <div>HOME</div>
        <div>ABOUT</div>
        <div>LOGIN</div>
        <div>CONTACT</div>
    </div>
    <div>
        <div class="main">
            <div class="left">
            <div class="small-box">SMALL BOX 1</div>
            <div class="small-box">SMALL BOX 2</div>
            <div class="small-box">SMALL BOX 3</div>
        </div>
        <div class="content">
            MAIN CONTENT
        </div>
        <div class="sidebar">
            SIDEBAR
        </div>
        <div class="footer">
        <h2>FOOTER</h2>
    </div>
        </div>
    </div>
</body>
</html>
