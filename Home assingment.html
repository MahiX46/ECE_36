<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>

    <style>

        /* HEADER */
        .header {
            background: linear-gradient(to right, #293185cf, #297695);
            color: white;
            text-align: center;
            width: 100%;
            height: 150px;
        }

        /* NAVIGATION */
        .nav {
            display: flex;
            justify-content: space-around;
            align-items: center;

            background: linear-gradient(to right, #013c20, #016b4a);
            color: white;

            height: 60px;
            width: 100%;
        }

        /* LEFT AND RIGHT */
        .main {
            display: grid;
            grid-template-columns: 50% 50%;
            width: 100%;
        }

        .left {
            background: linear-gradient(to right, #350101, #67060b);
            color: white;

            height: 250px;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .right {
            background: linear-gradient(to right, #16164d, #313184);
            color: white;

            height: 250px;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* COLOUR SECTION */
        .colors {
            display: grid;
            grid-template-columns: 25% 25% 25% 25%;
            width: 100%;
        }

        .blue {
            background: linear-gradient(to right, #005bea, #00c6fb);
            color: white;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .red {
            background: linear-gradient(to right, #8b0000, #ff3333);
            color: white;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .green {
            background: linear-gradient(to right, #006400, #32cd32);
            color: white;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .yellow {
            background: linear-gradient(to right, #c9a600, #ffff00);
            color: black;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BOX SECTION */
        .boxes {
            display: grid;
            grid-template-columns: 20% 20% 20% 20% 20%;
            width: 100%;
        }

        .box1 {
            background: linear-gradient(to right, #082f3a, #102d2e);
            color: white;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box2 {
            background: linear-gradient(to right, #3b1010, #761414);
            color: white;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box3 {
            background: linear-gradient(to right, #103d20, #167a3a);
            color: white;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box4 {
            background: linear-gradient(to right, #403400, #806900);
            color: white;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box5 {
            background: linear-gradient(to right, #24103d, #54208c);
            color: white;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* FOOTER */
        .footer {
            background: linear-gradient(to right, #293185cf, #297695);
            color: white;

            text-align: center;

            height: 100px;
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>


<body>

    <!-- HEADER -->

    <div class="header">
        <h1>HEADER</h1>
    </div>


    <!-- NAVIGATION -->

    <div class="nav">

        <div>HOME</div>

        <div>ABOUT</div>

        <div>LOGIN</div>

    </div>


    <!-- LEFT AND RIGHT -->

    <div class="main">

        <div class="left">
            <h2>LEFT</h2>
        </div>

        <div class="right">
            <h2>RIGHT</h2>
        </div>

    </div>


    <!-- BLUE RED GREEN YELLOW -->

    <div class="colors">

        <div class="blue">
            <h2>BLUE</h2>
        </div>

        <div class="red">
            <h2>RED</h2>
        </div>

        <div class="green">
            <h2>GREEN</h2>
        </div>

        <div class="yellow">
            <h2>YELLOW</h2>
        </div>

    </div>


    <!-- BOX 1 TO BOX 5 -->

    <div class="boxes">

        <div class="box1">
            <h2>BOX 1</h2>
        </div>

        <div class="box2">
            <h2>BOX 2</h2>
        </div>

        <div class="box3">
            <h2>BOX 3</h2>
        </div>

        <div class="box4">
            <h2>BOX 4</h2>
        </div>

        <div class="box5">
            <h2>BOX 5</h2>
        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        <h2>FOOTER</h2>
    </div>


</body>

</html>
